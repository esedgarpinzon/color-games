<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulario en Inglés: Animales</title>
    <style>
        /* Estilos Generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }

        p.instrucciones {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Cuadrícula de Tarjetas */
        .grid-animales {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* Contenedor de la Tarjeta (Efecto 3D) */
        .tarjeta {
            background-color: transparent;
            width: 100%;
            height: 180px;
            perspective: 1000px; /* Crea el efecto 3D */
            cursor: pointer;
        }

        .tarjeta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        /* Clase que se activa con JavaScript para voltear */
        .tarjeta.volteada .tarjeta-inner {
            transform: rotateY(180deg);
        }

        /* Lados de la tarjeta */
        .tarjeta-frente, .tarjeta-atras {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 3px solid #ddd;
            box-sizing: border-box;
        }

        /* Frente: Imagen (Emoji) y nombre en Español */
        .tarjeta-frente {
            background-color: #ffffff;
            color: black;
        }

        .imagen-animal {
            font-size: 4rem; /* Tamaño del emoji */
            margin-bottom: 10px;
        }

        .nombre-espanol {
            font-size: 1.2rem;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Atrás: Nombre en Inglés */
        .tarjeta-atras {
            background-color: #3498db;
            color: white;
            transform: rotateY(180deg);
            border-color: #2980b9;
        }

        .nombre-ingles {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .icono-sonido {
            font-size: 1.5rem;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <h1>Aprende Animales en Inglés 🐾</h1>
    <p class="instrucciones">Haz clic en una tarjeta para ver su traducción y escuchar la pronunciación.</p>

    <div class="grid-animales" id="contenedor-animales">
        </div>

    <script>
        // Array con 25 animales: Español, Inglés y su imagen (emoji)
        const animales = [
            { es: "Perro", en: "Dog", img: "🐶" },
            { es: "Gato", en: "Cat", img: "🐱" },
            { es: "Ratón", en: "Mouse", img: "🐭" },
            { es: "Hámster", en: "Hamster", img: "🐹" },
            { es: "Conejo", en: "Rabbit", img: "🐰" },
            { es: "Zorro", en: "Fox", img: "🦊" },
            { es: "Oso", en: "Bear", img: "🐻" },
            { es: "Panda", en: "Panda", img: "🐼" },
            { es: "Koala", en: "Koala", img: "🐨" },
            { es: "Tigre", en: "Tiger", img: "🐯" },
            { es: "León", en: "Lion", img: "🦁" },
            { es: "Vaca", en: "Cow", img: "🐮" },
            { es: "Cerdo", en: "Pig", img: "🐷" },
            { es: "Rana", en: "Frog", img: "🐸" },
            { es: "Mono", en: "Monkey", img: "🐵" },
            { es: "Gallina", en: "Chicken", img: "🐔" },
            { es: "Pingüino", en: "Penguin", img: "🐧" },
            { es: "Pájaro", en: "Bird", img: "🐦" },
            { es: "Pato", en: "Duck", img: "🦆" },
            { es: "Búho", en: "Owl", img: "🦉" },
            { es: "Caballo", en: "Horse", img: "🐴" },
            { es: "Tortuga", en: "Turtle", img: "🐢" },
            { es: "Serpiente", en: "Snake", img: "🐍" },
            { es: "Delfín", en: "Dolphin", img: "🐬" },
            { es: "Elefante", en: "Elephant", img: "🐘" }
        ];

        const contenedor = document.getElementById('contenedor-animales');

        // Función para reproducir el audio en inglés
        function pronunciar(texto) {
            // Verifica si el navegador soporta síntesis de voz
            if ('speechSynthesis' in window) {
                const mensaje = new SpeechSynthesisUtterance();
                mensaje.text = texto;
                mensaje.lang = 'en-US'; // Idioma: Inglés de Estados Unidos
                mensaje.rate = 0.9;     // Velocidad ligeramente más lenta para que sea clara
                window.speechSynthesis.speak(mensaje);
            }
        }

        // Generar las tarjetas dinámicamente
        animales.forEach(animal => {
            // Crear elementos HTML
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta';

            const tarjetaInner = document.createElement('div');
            tarjetaInner.className = 'tarjeta-inner';

            // Lado Frontal (Español + Imagen)
            const tarjetaFrente = document.createElement('div');
            tarjetaFrente.className = 'tarjeta-frente';
            tarjetaFrente.innerHTML = `
                <div class="imagen-animal">${animal.img}</div>
                <div class="nombre-espanol">${animal.es}</div>
            `;

            // Lado Trasero (Inglés + Icono de sonido)
            const tarjetaAtras = document.createElement('div');
            tarjetaAtras.className = 'tarjeta-atras';
            tarjetaAtras.innerHTML = `
                <div class="nombre-ingles">${animal.en}</div>
                <div class="icono-sonido">🔊</div>
            `;

            // Ensamblar la tarjeta
            tarjetaInner.appendChild(tarjetaFrente);
            tarjetaInner.appendChild(tarjetaAtras);
            tarjeta.appendChild(tarjetaInner);
            contenedor.appendChild(tarjeta);

            // Añadir el evento de clic
            tarjeta.addEventListener('click', () => {
                // Alternar la clase que da vuelta a la tarjeta
                tarjeta.classList.toggle('volteada');
                
                // Si la tarjeta se está mostrando del lado de inglés, pronunciar la palabra
                if (tarjeta.classList.contains('volteada')) {
                    pronunciar(animal.en);
                }
            });
        });
    </script>
</body>
</html>
