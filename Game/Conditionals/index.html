<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditionals Quiz - Random 15</title>
    <style>
        body {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        #app {
            background: white;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .hidden {
            display: none !important;
        }

        /* Pantallas */
        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #46178f;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        /* Botón de Inicio/Reinicio */
        .btn-primary {
            background-color: #46178f;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #321066;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-primary:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Cabecera del Juego */
        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            background: #fff;
            box-sizing: border-box;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #eee;
        }

        .timer {
            background: #46178f;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        /* Área de la Pregunta */
        .question-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #f2f2f2;
            width: 100%;
            box-sizing: border-box;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 95%;
        }

        /* Cuadrícula de Respuestas */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-answer {
            color: white;
            border: none;
            padding: 30px 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .btn-answer:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .btn-red { background-color: #e21b3c; box-shadow: 0 6px 0 #b0152e; }
        .btn-blue { background-color: #1368ce; box-shadow: 0 6px 0 #0f51a1; }
        .btn-yellow { background-color: #d89e00; box-shadow: 0 6px 0 #a87b00; }
        .btn-green { background-color: #26890c; box-shadow: 0 6px 0 #1d6b09; }

        .shape {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 15px;
            background-color: white;
        }
        .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .shape-diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .shape-circle { border-radius: 50%; }

        /* Estilos de la pantalla final (Gatos) */
        .cat-emoji {
            font-size: 6rem;
            margin-bottom: 10px;
        }
        .feedback-message {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <div id="app">
        <!-- PANTALLA DE INICIO -->
        <div id="start-screen" class="screen">
            <h1>Mixed Conditionals</h1>
            <h2>Random 15 Questions</h2>
            <p>Score more than 80 to win!</p>
            <button class="btn-primary" onclick="startGame()">Start Quiz</button>
        </div>

        <!-- PANTALLA DEL JUEGO -->
        <div id="quiz-screen" class="screen hidden" style="padding: 0;">
            <div class="game-header">
                <div>Q: <span id="question-counter">1</span>/15</div>
                <div class="timer" id="timer">20</div>
                <div>Score: <span id="score">0</span>%</div>
            </div>
            
            <div class="question-area">
                <div class="question-text" id="question-text">Loading question...</div>
            </div>

            <div class="answers-grid">
                <button class="btn-answer btn-red" onclick="checkAnswer(0)">
                    <span class="shape shape-triangle"></span> <span id="opt0">Opción 1</span>
                </button>
                <button class="btn-answer btn-blue" onclick="checkAnswer(1)">
                    <span class="shape shape-diamond"></span> <span id="opt1">Opción 2</span>
                </button>
                <button class="btn-answer btn-yellow" onclick="checkAnswer(2)">
                    <span class="shape shape-circle"></span> <span id="opt2">Opción 3</span>
                </button>
                <button class="btn-answer btn-green" onclick="checkAnswer(3)">
                    <span class="shape shape-square"></span> <span id="opt3">Opción 4</span>
                </button>
            </div>
        </div>

        <!-- PANTALLA FINAL -->
        <div id="end-screen" class="screen hidden">
            <div id="cat-container" class="cat-emoji">😸</div>
            <div id="feedback-message" class="feedback-message">you are amazing</div>
            <h2>Your Score: <span id="final-score">0</span> / 100</h2>
            <button class="btn-primary" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Array de 15 preguntas con los condicionales listos para ser mezclados
        let questions = [
            { q: "If you freeze water, it ___ into ice.", options: ["turns", "will turn", "would turn", "turned"], correct: 0 },
            { q: "If Los Rojos ___ the next game, they will win the league.", options: ["win", "will win", "won", "had won"], correct: 0 },
            { q: "If I ___ a million dollars, I would travel the world.", options: ["had", "have", "will have", "had had"], correct: 0 },
            { q: "If she had studied, she ___ the exam.", options: ["would have passed", "would pass", "will pass", "passes"], correct: 0 },
            { q: "People get tired if they ___ sleep enough.", options: ["don't", "won't", "didn't", "wouldn't"], correct: 0 },
            { q: "If it rains tomorrow, we ___ the picnic.", options: ["will cancel", "cancel", "would cancel", "cancelled"], correct: 0 },
            { q: "If I were you, I ___ that car.", options: ["wouldn't buy", "won't buy", "didn't buy", "hadn't bought"], correct: 0 },
            { q: "If I had known you were in Cayalá, I ___ you.", options: ["would have visited", "would visit", "will visit", "visited"], correct: 0 },
            { q: "If you touch a fire, you ___ burned.", options: ["get", "will get", "would get", "got"], correct: 0 },
            { q: "If she calls me, I ___ her the truth.", options: ["will tell", "tell", "told", "would tell"], correct: 0 },
            { q: "What would you do if you ___ a ghost?", options: ["saw", "see", "will see", "had seen"], correct: 0 },
            { q: "I would have bought the perfume if I ___ enough money.", options: ["had had", "had", "have", "will have"], correct: 0 },
            { q: "We will miss the bus if we ___ leave now.", options: ["don't", "didn't", "won't", "wouldn't"], correct: 0 },
            { q: "If he ___ English better, he would get the job.", options: ["spoke", "speaks", "will speak", "had spoken"], correct: 0 },
            { q: "If they had taken a taxi, they ___ the flight.", options: ["wouldn't have missed", "wouldn't miss", "won't miss", "didn't miss"], correct: 0 }
        ];

        // Función para mezclar aleatoriamente las opciones dentro de cada pregunta
        function shuffleOptions(question) {
            const optionsWithIndex = question.options.map((opt, index) => ({ opt, isCorrect: index === question.correct }));
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }
            question.options = optionsWithIndex.map(item => item.opt);
            question.correct = optionsWithIndex.findIndex(item => item.isCorrect);
        }

        // Función para mezclar el orden de las preguntas (para que salgan al azar)
        function shuffleQuestions(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let timeLeft = 20;
        let timerInterval;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');
        const questionText = document.getElementById('question-text');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const questionCounter = document.getElementById('question-counter');

        function startGame() {
            // Mezclamos el orden de las preguntas y sus opciones al iniciar el juego
            shuffleQuestions(questions);
            questions.forEach(shuffleOptions);

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            correctAnswers = 0;
            scoreElement.innerText = 0;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 20;
            timerElement.innerText = timeLeft;

            const currentQ = questions[currentQuestionIndex];
            questionText.innerText = currentQ.q;
            questionCounter.innerText = currentQuestionIndex + 1;

            document.getElementById('opt0').innerText = currentQ.options[0];
            document.getElementById('opt1').innerText = currentQ.options[1];
            document.getElementById('opt2').innerText = currentQ.options[2];
            document.getElementById('opt3').innerText = currentQ.options[3];

            timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkAnswer(-1); // Se acabó el tiempo
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const correctIndex = questions[currentQuestionIndex].correct;

            if (selectedIndex === correctIndex) {
                correctAnswers++;
                // Actualizamos el porcentaje en vivo
                scoreElement.innerText = Math.round((correctAnswers / 15) * 100);
                document.body.style.backgroundColor = "#26890c"; // Verde (correcto)
            } else {
                document.body.style.backgroundColor = "#e21b3c"; // Rojo (incorrecto)
            }

            setTimeout(() => {
                document.body.style.backgroundColor = "#f2f2f2";
                currentQuestionIndex++;
                
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 600);
        }

        function endGame() {
            quizScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            
            // Calcular puntaje final exacto sobre 100
            let finalScore = Math.round((correctAnswers / 15) * 100);
            document.getElementById('final-score').innerText = finalScore;

            const catContainer = document.getElementById('cat-container');
            const feedback = document.getElementById('feedback-message');

            // Lógica del gato basada en la puntuación > 80
            if (finalScore > 80) {
                catContainer.innerText = "😸"; // Gato feliz
                feedback.innerText = "you are amazing";
                feedback.style.color = "#26890c";
            } else {
                catContainer.innerText = "😿"; // Gato triste
                feedback.innerText = "good luck next time dude";
                feedback.style.color = "#e21b3c";
            }
        }
    </script>
</body>
</html>
