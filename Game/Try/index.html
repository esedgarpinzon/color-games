<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary App</title>
    <style>
        /* Estilos Generales */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        /* Menú Principal */
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .menu-btn { background: white; border: none; padding: 30px; border-radius: 15px; cursor: pointer; font-size: 1.2em; font-weight: bold; color: #667eea; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .menu-btn:hover { transform: translateY(-5px); }

        /* Secciones */
        .section { background: white; border-radius: 20px; padding: 30px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: fadeIn 0.5s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Flashcards */
        .flashcard-container { perspective: 1000px; max-width: 400px; margin: 30px auto; height: 350px; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: 0.6s; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .flashcard-front { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .flashcard-back { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; transform: rotateY(180deg); }
        .fc-content { font-size: 8em; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        .fc-content img { width: 150px; height: 150px; object-fit: contain; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { background: #667eea; color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 1em; transition: 0.3s; }
        .btn:hover { background: #764ba2; }

        /* Quiz */
        .quiz-icon { font-size: 10em; text-align: center; margin-bottom: 30px; display: flex; justify-content: center; }
        .quiz-icon img { width: 200px; height: 200px; object-fit: contain; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .quiz-option { background: #f0f0f0; border: 3px solid transparent; padding: 20px; border-radius: 15px; cursor: pointer; font-size: 1.3em; font-weight: bold; text-align: center; transition: 0.3s; }
        .quiz-option:hover { background: #667eea; color: white; }
        .quiz-option.correct { background: #4CAF50; color: white; }
        .quiz-option.wrong { background: #f44336; color: white; }

        /* Memory Game */
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; }
        .memory-card { aspect-ratio: 1; background: #667eea; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 2.5em; color: white; transition: 0.3s; }
        .memory-card.flipped { background: white; color: #333; }
        .memory-card.matched { background: #4CAF50; color: white; cursor: default; }
        .memory-card img { width: 70%; height: 70%; object-fit: contain; }

        /* Vocabulary List - CORREGIDO */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .vocab-item { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }
        /* Esta regla es la clave: fuerza a las imágenes a tener un tamaño uniforme */
        .vocab-item img {
            width: 80px !important;
            height: 80px !important;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .back-btn { background: #f5576c; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇬🇧 English Vocabulary</h1>
        
        <div id="menu" class="menu">
            <button class="menu-btn" onclick="showSection('flashcards')">🎴 Flashcards</button>
            <button class="menu-btn" onclick="showSection('quiz')">❓ Quiz Game</button>
            <button class="menu-btn" onclick="showSection('memory')">🧠 Memory Game</button>
            <button class="menu-btn" onclick="showSection('list')">📋 Vocabulary List</button>
        </div>

        <!-- Flashcards Section -->
        <div id="flashcards" class="section">
            <button class="btn back-btn" onclick="showSection('menu')">← Back to Menu</button>
            <div class="flashcard-container">
                <div class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="flashcard-front">
                        <div class="fc-content" id="fc-icon"></div>
                        <div style="font-size: 1.5em;">Click to flip!</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="fc-content" id="fc-word-back" style="font-size: 2em; font-weight: bold;"></div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn" onclick="prevCard()">← Previous</button>
                <button class="btn" onclick="nextCard()">Next →</button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quiz" class="section">
            <button class="btn back-btn" onclick="showSection('menu')">← Back to Menu</button>
            <div class="score" style="text-align: center; font-size: 1.5em; margin: 20px; color: #667eea;">Score: <span id="score">0</span></div>
            <div class="quiz-icon" id="quiz-icon"></div>
            <div class="quiz-options" id="quiz-options"></div>
            <div class="controls"><button class="btn" onclick="newQuestion()">Next Question →</button></div>
        </div>

        <!-- Memory Section -->
        <div id="memory" class="section">
            <button class="btn back-btn" onclick="showSection('menu')">← Back to Menu</button>
            <div class="score" style="text-align: center; margin: 20px;">Moves: <span id="moves">0</span> | Pairs: <span id="pairs">0</span>/8</div>
            <div class="memory-grid" id="memory-grid"></div>
            <div class="controls"><button class="btn" onclick="initMemoryGame()">🔄 Restart Game</button></div>
        </div>

        <!-- List Section -->
        <div id="list" class="section">
            <button class="btn back-btn" onclick="showSection('menu')">← Back to Menu</button>
            <div class="vocab-grid" id="vocab-grid"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE VOCABULARIO
        const vocabulary = [
            { word: 'BAT', icon: '<img src="img/bat.svg" alt="Bat">', type: 'image' },
            { word: 'COW', icon: '🐄', type: 'emoji' },
            { word: 'RAT', icon: '🐀', type: 'emoji' },
            { word: 'BIRD', icon: '️', type: 'emoji' },
            { word: 'PAPER', icon: '', type: 'emoji' },
            { word: 'CRAYON', icon: '🖍️', type: 'emoji' },
            { word: 'MARKER', icon: '🖋️', type: 'emoji' },
            { word: 'GLUE', icon: '🧴', type: 'emoji' },
            { word: 'BOOK', icon: '📘', type: 'emoji' },
            { word: 'BACKPACK', icon: '🎒', type: 'emoji' },
            { word: 'ERASER', icon: '<img src="img/eraser.svg" alt="Eraser">', type: 'image' },
            { word: 'BOX', icon: '📦', type: 'emoji' },
            { word: 'PENCIL', icon: '✏️', type: 'emoji' },
            { word: 'CHAIR', icon: '🪑', type: 'emoji' },
            { word: 'TABLE', icon: '<img src="img/table.svg" alt="Table">', type: 'image' }
        ];

        let currentIndex = 0;
        let score = 0;
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('menu').style.display = id === 'menu' ? 'grid' : 'none';
            if (id !== 'menu') {
                document.getElementById(id).classList.add('active');
                if (id === 'flashcards') loadFlashcard();
                if (id === 'quiz') newQuestion();
                if (id === 'memory') initMemoryGame();
                if (id === 'list') loadList();
            }
        }

        // Lógica de Flashcards
        function loadFlashcard() {
            const card = vocabulary[currentIndex];
            document.getElementById('fc-icon').innerHTML = card.icon;
            document.getElementById('fc-word-back').textContent = card.word;
            document.querySelector('.flashcard').classList.remove('flipped');
        }
        function nextCard() { currentIndex = (currentIndex + 1) % vocabulary.length; loadFlashcard(); }
        function prevCard() { currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; loadFlashcard(); }

        // Lógica del Quiz
        function newQuestion() {
            const correct = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            document.getElementById('quiz-icon').innerHTML = correct.icon;
            let options = [correct];
            while (options.length < 4) {
                const r = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.includes(r)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'quiz-option';
                btn.textContent = opt.word;
                btn.onclick = () => {
                    if (opt.word === correct.word) {
                        btn.classList.add('correct');
                        score++;
                        document.getElementById('score').textContent = score;
                    } else {
                        btn.classList.add('wrong');
                    }
                };
                container.appendChild(btn);
            });
        }

        // Lógica del Memory Game
        function initMemoryGame() {
            matchedPairs = 0; moves = 0; flippedCards = [];
            document.getElementById('moves').textContent = 0;
            document.getElementById('pairs').textContent = 0;
            const selected = [...vocabulary].sort(() => Math.random() - 0.5).slice(0, 8);
            let cards = [];
            selected.forEach((item, i) => {
                cards.push({ id: i, content: item.icon, type: 'icon' });
                cards.push({ id: i, content: item.word, type: 'word' });
            });
            cards.sort(() => Math.random() - 0.5);
            
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = '';
            cards.forEach((card, idx) => {
                const el = document.createElement('div');
                el.className = 'memory-card';
                el.dataset.idx = idx;
                el.dataset.id = card.id;
                el.textContent = '?';
                el.onclick = () => flip(el, card);
                grid.appendChild(el);
            });
        }

        function flip(el, card) {
            if (el.classList.contains('flipped') || el.classList.contains('matched') || flippedCards.length >= 2) return;
            el.classList.add('flipped');
            el.innerHTML = card.content;
            if (card.type === 'word') el.style.fontSize = '1.2em';
            flippedCards.push({ el, id: card.id });
            
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                if (flippedCards[0].id === flippedCards[1].id) {
                    flippedCards.forEach(c => c.el.classList.add('matched'));
                    matchedPairs++;
                    document.getElementById('pairs').textContent = matchedPairs;
                    flippedCards = [];
                } else {
                    setTimeout(() => {
                        flippedCards.forEach(c => {
                            c.el.classList.remove('flipped');
                            c.el.textContent = '?';
                            c.el.style.fontSize = '2.5em';
                        });
                        flippedCards = [];
                    }, 1000);
                }
            }
        }

        function loadList() {
            const grid = document.getElementById('vocab-grid');
            grid.innerHTML = '';
            vocabulary.forEach(item => {
                const div = document.createElement('div');
                div.className = 'vocab-item';
                div.innerHTML = `<div>${item.icon}</div><div style="font-weight:bold; margin-top:10px;">${item.word}</div>`;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
