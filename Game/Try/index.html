<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🧪 El Laboratorio del Dr. Opuesto - CON SONIDO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', cursive; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #1a0033 0%, #330066 50%, #0d001a 100%);
    overflow: hidden;
    position: relative;
  }
  
  /* Botón de mute */
  .mute-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid #00ff99;
    color: #00ff99;
    font-size: 24px;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s;
  }
  .mute-btn:hover {
    background: rgba(0,255,150,0.3);
    transform: scale(1.1);
  }
  .mute-btn.muted {
    background: rgba(255,0,100,0.3);
    border-color: #ff3366;
    color: #ff3366;
  }
  
  /* Burbujas de fondo tipo laboratorio */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(0,255,150,0.4), rgba(0,100,200,0.1));
    animation: float 8s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(20px); }
  }
  
  /* Header con puntaje */
  .header {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 10px 30px;
    border-radius: 30px;
    border: 2px solid #00ff99;
    color: #00ff99;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 10px #00ff99;
    z-index: 10;
  }
  
  /* Escenario principal */
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  /* Científico loco */
  .scientist {
    position: absolute;
    left: 5%;
    bottom: 15%;
    font-size: 120px;
    animation: scientistBounce 2s infinite ease-in-out;
    filter: drop-shadow(0 0 15px #00ff99);
    z-index: 5;
  }
  @keyframes scientistBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .scientist::after {
    content: attr(data-speech);
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: #330066;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 18px;
    white-space: nowrap;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .scientist.talking::after { opacity: 1; }
  
  /* La MÁQUINA */
  .machine {
    position: relative;
    width: 320px;
    height: 380px;
    background: linear-gradient(145deg, #4a4a6a, #2a2a4a);
    border-radius: 30px;
    border: 6px solid #888;
    box-shadow: 
      inset 0 0 30px rgba(0,0,0,0.5),
      0 0 40px rgba(0,255,150,0.3),
      0 10px 30px rgba(0,0,0,0.5);
    z-index: 3;
  }
  
  /* Tubos laterales */
  .tube {
    position: absolute;
    width: 40px;
    height: 150px;
    background: linear-gradient(90deg, #00ff99, #00ccff, #00ff99);
    border-radius: 20px;
    top: 50px;
    opacity: 0.7;
    box-shadow: 0 0 20px #00ff99;
  }
  .tube.left { left: -25px; }
  .tube.right { right: -25px; }
  .tube::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 20%;
    left: 10px;
    animation: bubbleUp 2s infinite;
  }
  @keyframes bubbleUp {
    0% { top: 80%; opacity: 0; }
    50% { opacity: 1; }
    100% { top: 10%; opacity: 0; }
  }
  
  /* Pantalla de la máquina */
  .screen {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 200px;
    background: radial-gradient(circle, #001a00, #000);
    border-radius: 20px;
    border: 5px solid #555;
    box-shadow: inset 0 0 30px #00ff99, 0 0 15px rgba(0,255,150,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  
  /* Objeto dentro de la pantalla */
  .object {
    font-size: 100px;
    transition: all 0.5s;
    filter: drop-shadow(0 0 10px #fff);
  }
  .object.entering {
    animation: enterMachine 1s forwards;
  }
  @keyframes enterMachine {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.3) rotate(360deg); opacity: 0.5; filter: blur(5px); }
    100% { transform: scale(0) rotate(720deg); opacity: 0; }
  }
  .object.transforming {
    animation: transform 1.5s forwards;
  }
  @keyframes transform {
    0% { transform: scale(0); opacity: 0; }
    30% { transform: scale(1.5) rotate(180deg); opacity: 1; filter: hue-rotate(90deg) brightness(2); }
    60% { transform: scale(0.8) rotate(360deg); filter: hue-rotate(180deg); }
    100% { transform: scale(1) rotate(360deg); filter: none; }
  }
  .object.exiting {
    animation: exitMachine 1s forwards;
  }
  @keyframes exitMachine {
    0% { transform: scale(1); }
    100% { transform: scale(1.5) translateY(50px); opacity: 0.5; }
  }
  
  /* Luces de la máquina */
  .lights {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
  }
  .light {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #ff3366;
    box-shadow: 0 0 10px #ff3366;
    animation: blink 1s infinite;
  }
  .light:nth-child(2) { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; animation-delay: 0.3s; }
  .light:nth-child(3) { background: #00ff99; box-shadow: 0 0 10px #00ff99; animation-delay: 0.6s; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .machine.working .light { animation-duration: 0.2s; }
  .machine.working { animation: shake 0.1s infinite; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  
  /* Cinta transportadora */
  .conveyor {
    position: absolute;
    bottom: 8%;
    left: 0;
    width: 100%;
    height: 60px;
    background: repeating-linear-gradient(
      90deg,
      #333 0px, #333 30px,
      #555 30px, #555 60px
    );
    border-top: 4px solid #888;
    border-bottom: 4px solid #888;
    animation: moveConveyor 1s linear infinite;
    z-index: 2;
  }
  @keyframes moveConveyor {
    0% { background-position: 0 0; }
    100% { background-position: 60px 0; }
  }
  
  /* Palabra objetivo */
  .word-display {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ff0066, #ff9900);
    padding: 15px 40px;
    border-radius: 30px;
    color: white;
    font-size: 32px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 5px 20px rgba(255,0,102,0.5);
    border: 3px solid white;
    z-index: 10;
    text-shadow: 2px 2px 0 #000;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .word-display:hover {
    transform: translateX(-50%) scale(1.05);
  }
  .word-display::after {
    content: "🔊";
    margin-left: 10px;
    font-size: 24px;
  }
  
  /* Botones de respuesta */
  .buttons {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 10;
  }
  .btn {
    padding: 15px 25px;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    color: white;
    min-width: 140px;
    transition: all 0.2s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.4);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    font-family: 'Comic Sans MS', cursive;
    position: relative;
  }
  .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 12px 25px rgba(0,0,0,0.5); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-1 { background: linear-gradient(135deg, #ff4757, #c44569); }
  .btn-2 { background: linear-gradient(135deg, #3742fa, #2f3be0); }
  .btn-3 { background: linear-gradient(135deg, #2ed573, #1e9c54); }
  .btn::after {
    content: "🔊";
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 20px;
    background: white;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  
  /* Mensaje de feedback */
  .feedback {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    font-weight: bold;
    pointer-events: none;
    z-index: 100;
    text-shadow: 0 0 30px currentColor;
  }
  .feedback.show {
    animation: feedbackPop 1.2s forwards;
  }
  @keyframes feedbackPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.5) rotate(0); opacity: 0; }
  }
  .feedback.correct { color: #00ff99; }
  .feedback.wrong { color: #ff3366; }
  
  /* Pantalla final */
  .end-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 200;
    color: white;
    text-align: center;
  }
  .end-screen.show { display: flex; }
  .end-screen h1 {
    font-size: 60px;
    color: #00ff99;
    text-shadow: 0 0 30px #00ff99;
    margin-bottom: 20px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .end-screen p { font-size: 28px; margin: 10px; }
  .end-screen button {
    margin-top: 30px;
    padding: 20px 50px;
    font-size: 24px;
    background: linear-gradient(135deg, #ff0066, #ff9900);
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(255,0,102,0.5);
    font-family: 'Comic Sans MS', cursive;
  }
  
  /* Confeti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: fall 3s linear forwards;
    z-index: 150;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

<button class="mute-btn" id="muteBtn" title="Silenciar/Activar sonido">🔊</button>

<div class="header">⭐ Puntos: <span id="score">0</span> | 🧪 Nivel: <span id="level">1</span>/9</div>

<div class="word-display" id="wordDisplay">Cargando...</div>

<div class="stage">
  <div class="scientist" id="scientist" data-speech="¡Transformemos!">🧑‍🔬</div>
  
  <div class="machine" id="machine">
    <div class="tube left"></div>
    <div class="tube right"></div>
    <div class="screen">
      <div class="object" id="object">🎈</div>
    </div>
    <div class="lights">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>
  </div>
</div>

<div class="conveyor"></div>

<div class="buttons" id="buttons">
  <button class="btn btn-1" data-answer="0"></button>
  <button class="btn btn-2" data-answer="1"></button>
  <button class="btn btn-3" data-answer="2"></button>
</div>

<div class="feedback" id="feedback"></div>

<div class="end-screen" id="endScreen">
  <h1>🎉 ¡INCREÍBLE! 🎉</h1>
  <p>¡Eres un verdadero científico de los opuestos!</p>
  <p>⭐ Puntaje final: <span id="finalScore">0</span></p>
  <p>🧪 Transformaciones completadas: 9/9</p>
  <button onclick="restartGame()">🔄 Jugar de nuevo</button>
</div>

<script>
  // ============ SISTEMA DE AUDIO ============
  let isMuted = false;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Función para hablar en inglés
  function speak(text, rate = 0.9) {
    if (isMuted) return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      utterance.pitch = 1.1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }
  }
  
  // Generar sonidos con Web Audio API
  function playTone(frequency, duration, type = 'sine') {
    if (isMuted) return;
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.frequency.value = frequency;
    oscillator.type = type;
    
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    oscillator.start(audioCtx.currentTime);
    oscillator.stop(audioCtx.currentTime + duration);
  }
  
  // Sonido de éxito (acorde mayor)
  function playSuccess() {
    if (isMuted) return;
    playTone(523.25, 0.15); // Do
    setTimeout(() => playTone(659.25, 0.15), 100); // Mi
    setTimeout(() => playTone(783.99, 0.3), 200); // Sol
  }
  
  // Sonido de error
  function playError() {
    if (isMuted) return;
    playTone(200, 0.2, 'sawtooth');
    setTimeout(() => playTone(150, 0.3, 'sawtooth'), 150);
  }
  
  // Sonido de transformación de la máquina
  function playTransform() {
    if (isMuted) return;
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        playTone(200 + i * 100, 0.1, 'square');
      }, i * 80);
    }
  }
  
  // Sonido de botón
  function playClick() {
    if (isMuted) return;
    playTone(800, 0.05);
  }
  
  // Botón de mute
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.classList.toggle('muted', isMuted);
    if (!isMuted) {
      audioCtx.resume();
    }
  });
  
  // ============ LÓGICA DEL JUEGO ============
  const pairs = [
    { word: "OPEN",  emoji: "🚪", opposite: "SHUT",   oppEmoji: "🚪", hint: "cerrar" },
    { word: "BIG",   emoji: "🎈", opposite: "SMALL",  oppEmoji: "🎈", hint: "pequeño" },
    { word: "FAST",  emoji: "🐰", opposite: "SLOW",   oppEmoji: "🐢", hint: "lento" },
    { word: "LOUD",  emoji: "🔊", opposite: "QUIET",  oppEmoji: "🔈", hint: "silencio" },
    { word: "TALL",  emoji: "🦒", opposite: "SHORT",  oppEmoji: "🐁", hint: "bajo" },
    { word: "THIN",  emoji: "🥕", opposite: "CHUBBY", oppEmoji: "🐷", hint: "gordito" },
    { word: "OLD",   emoji: "👴", opposite: "NEW",    oppEmoji: "👶", hint: "nuevo/bebé" },
    { word: "STRONG",emoji: "💪", opposite: "WEAK",   oppEmoji: "🐭", hint: "débil" },
    { word: "NICE",  emoji: "😇", opposite: "BAD",    oppEmoji: "😈", hint: "malo" }
  ];
  
  let currentPair = null;
  let score = 0;
  let level = 0;
  let isAnimating = false;
  let shuffledPairs = [];
  
  const objectEl = document.getElementById('object');
  const wordDisplay = document.getElementById('wordDisplay');
  const buttons = document.querySelectorAll('.btn');
  const machine = document.getElementById('machine');
  const feedback = document.getElementById('feedback');
  const scientist = document.getElementById('scientist');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const endScreen = document.getElementById('endScreen');
  
  function createBubbles() {
    for (let i = 0; i < 15; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 80 + 30;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.top = Math.random() * 100 + '%';
      b.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(b);
    }
  }
  createBubbles();
  
  function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
  }
  
  function startRound() {
    if (level >= shuffledPairs.length) {
      endGame();
      return;
    }
    
    currentPair = shuffledPairs[level];
    isAnimating = false;
    
    wordDisplay.textContent = currentPair.word;
    objectEl.textContent = currentPair.emoji;
    objectEl.className = 'object';
    
    levelEl.textContent = level + 1;
    
    buttons.forEach(b => b.disabled = false);
    
    const distractors = pairs.filter(p => p.opposite !== currentPair.opposite);
    const shuffledDist = shuffle([...distractors]).slice(0, 2);
    const options = shuffle([
      { text: currentPair.opposite, correct: true },
      { text: shuffledDist[0].opposite, correct: false },
      { text: shuffledDist[1].opposite, correct: false }
    ]);
    
    buttons.forEach((btn, i) => {
      btn.textContent = options[i].text;
      btn.dataset.correct = options[i].correct;
    });
    
    scientist.classList.add('talking');
    scientist.dataset.speech = "¡Transformemos!";
    
    // Pronunciar la palabra automáticamente
    setTimeout(() => {
      speak(currentPair.word);
      scientist.dataset.speech = `Say: ${currentPair.word}`;
    }, 500);
    
    setTimeout(() => scientist.classList.remove('talking'), 3000);
  }
  
  // Click en palabra para escuchar
  wordDisplay.addEventListener('click', () => {
    if (currentPair) {
      playClick();
      speak(currentPair.word);
    }
  });
  
  // Click en botones para escuchar
  buttons.forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      if (!btn.disabled) {
        playClick();
        speak(btn.textContent, 1);
      }
    });
  });
  
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;
      buttons.forEach(b => b.disabled = true);
      
      playClick();
      const isCorrect = btn.dataset.correct === 'true';
      
      if (isCorrect) {
        handleCorrect(btn);
      } else {
        handleWrong(btn);
      }
    });
  });
  
  function handleCorrect(btn) {
    score += 10;
    scoreEl.textContent = score;
    
    playSuccess();
    speak("Correct!");
    
    objectEl.classList.add('entering');
    machine.classList.add('working');
    
    showFeedback('✅ ¡SÍ!', true);
    
    setTimeout(() => {
      playTransform();
      objectEl.textContent = currentPair.oppEmoji;
      objectEl.classList.remove('entering');
      objectEl.classList.add('transforming');
      
      wordDisplay.textContent = currentPair.opposite;
      wordDisplay.style.background = 'linear-gradient(135deg, #00ff99, #00ccff)';
      
      scientist.dataset.speech = currentPair.opposite;
      scientist.classList.add('talking');
      
      setTimeout(() => {
        speak(currentPair.opposite);
      }, 300);
      
      setTimeout(() => {
        machine.classList.remove('working');
        wordDisplay.style.background = '';
        scientist.classList.remove('talking');
        level++;
        setTimeout(startRound, 1200);
      }, 1500);
    }, 1000);
  }
  
  function handleWrong(btn) {
    playError();
    speak("Try again!");
    
    btn.style.animation = 'shake 0.5s';
    setTimeout(() => btn.style.animation = '', 500);
    
    showFeedback('❌ ¡Intenta otra!', false);
    
    scientist.textContent = '🙀';
    scientist.dataset.speech = "Oops!";
    scientist.classList.add('talking');
    
    setTimeout(() => {
      scientist.textContent = '🧑‍🔬';
      scientist.classList.remove('talking');
      isAnimating = false;
      buttons.forEach(b => b.disabled = false);
    }, 1200);
  }
  
  function showFeedback(text, isCorrect) {
    feedback.textContent = text;
    feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    setTimeout(() => feedback.className = 'feedback', 1200);
  }
  
  function endGame() {
    document.getElementById('finalScore').textContent = score;
    endScreen.classList.add('show');
    launchConfetti();
    
    setTimeout(() => {
      speak("Congratulations! You are amazing!");
    }, 500);
  }
  
  function launchConfetti() {
    const colors = ['#ff0066', '#00ff99', '#ffcc00', '#3742fa', '#ff9900'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 2 + 's';
      c.style.animationDuration = (Math.random() * 2 + 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }
  
  function restartGame() {
    score = 0;
    level = 0;
    scoreEl.textContent = 0;
    endScreen.classList.remove('show');
    shuffledPairs = shuffle([...pairs]);
    playClick();
    startRound();
  }
  
  // Iniciar juego
  shuffledPairs = shuffle([...pairs]);
  
  // Activar audio al primer click (requerimiento del navegador)
  document.addEventListener('click', function initAudio() {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    document.removeEventListener('click', initAudio);
  }, { once: true });
  
  startRound();
</script>

</body>
</html>
