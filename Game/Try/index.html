<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UEC Academy - English Opposites</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           ESTILOS GENERALES
           ========================================= */
        :root {
            --bg-gradient: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            --balloon-colors: #FF6B6B, #4ECDC4, #FFE66D, #FF9F43, #A29BFE, #FD79A8;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================================
           MENÚ PRINCIPAL
           ========================================= */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .main-title {
            font-family: 'Fredoka One', cursive;
            font-size: 10vmin;
            color: #2D3436;
            text-shadow: 3px 3px 0px #FFF;
            margin-bottom: 5vh;
            text-align: center;
            line-height: 1.2;
        }

        .menu-btn {
            background: #fff;
            border: 4px solid #4ECDC4;
            border-radius: 20px;
            padding: 3vh 6vw;
            font-size: 5vmin;
            font-family: 'Fredoka One', cursive;
            color: #2D3436;
            cursor: pointer;
            margin: 2vh;
            box-shadow: 0 6px 0 #2A9D8F, 0 10px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            width: 80vw;
            max-width: 400px;
            text-align: center;
        }

        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2A9D8F, 0 4px 4px rgba(0,0,0,0.1);
        }

        .menu-btn.play-btn {
            border-color: #FF9F43;
            box-shadow: 0 6px 0 #E67E22, 0 10px 10px rgba(0,0,0,0.1);
            background: #FFF5E6;
        }

        .menu-btn.play-btn:active {
            box-shadow: 0 2px 0 #E67E22, 0 4px 4px rgba(0,0,0,0.1);
        }

        /* =========================================
           BOTÓN HOME (Navegación)
           ========================================= */
        .home-btn {
            position: absolute;
            top: 2vh;
            left: 2vw;
            background: #fff;
            border: 3px solid #FF9F43;
            border-radius: 50%;
            width: 10vmin;
            height: 10vmin;
            font-size: 5vmin;
            cursor: pointer;
            z-index: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #E67E22;
            transition: transform 0.1s;
        }

        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E67E22;
        }

        /* =========================================
           PANTALLA DE REPASO (FLASHCARDS)
           ========================================= */
        #review-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 400;
            overflow-y: auto;
            padding-top: 15vh;
            padding-bottom: 5vh;
        }

        .review-title {
            font-family: 'Fredoka One', cursive;
            font-size: 6vmin;
            color: #2D3436;
            margin-bottom: 4vh;
            text-align: center;
            padding: 0 5vw;
        }

        #review-cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4vmin;
            width: 90vw;
            max-width: 800px;
        }

        /* Animación 3D de la tarjeta */
        .card {
            background-color: transparent;
            width: 25vmin;
            height: 25vmin;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg) scale(1.05);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .card-front {
            background-color: #FFF;
            border: 4px solid #4ECDC4;
            font-size: 12vmin;
        }
        
        /* Estilo para imágenes dentro de las tarjetas */
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-back {
            background-color: #FFE66D;
            border: 4px solid #FF9F43;
            transform: rotateY(180deg);
            font-family: 'Fredoka One', cursive;
            font-size: 5vmin;
            color: #2D3436;
        }

        /* =========================================
           CONTENEDOR DEL JUEGO
           ========================================= */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #game-ui {
            position: absolute;
            top: 5vh;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        #speaker-btn {
            pointer-events: auto;
            background: #fff;
            border: 4px solid #FF9F43;
            border-radius: 50%;
            width: 15vmin;
            height: 15vmin;
            font-size: 8vmin;
            cursor: pointer;
            box-shadow: 0 6px 0 #E67E22, 0 10px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2vh;
        }

        #speaker-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E67E22, 0 4px 4px rgba(0,0,0,0.2);
        }

        #target-word {
            font-family: 'Fredoka One', cursive;
            font-size: 8vmin;
            color: #2D3436;
            text-shadow: 3px 3px 0px #FFF;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            padding: 1vh 4vw;
            border-radius: 20px;
            display: inline-block;
        }

        #target-word.visible {
            opacity: 1;
        }

        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -25vh;
            width: 22vmin;
            height: 26vmin;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset -1vmin -1vmin 2vmin rgba(0,0,0,0.1), 0 1vmin 0.5vmin rgba(0,0,0,0.1);
            z-index: 10;
        }

        .balloon-content {
            width: 90%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10vmin;
            transition: filter 0.2s ease;
            overflow: hidden;
            border-radius: 50%;
        }
        
        .balloon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -2.5vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 0.4vmin;
            height: 3vmin;
            background: rgba(0,0,0,0.3);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -0.5vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 1vmin solid transparent;
            border-right: 1vmin solid transparent;
            border-top: 1.5vmin solid inherit;
        }

        .balloon:active {
            transform: scale(0.95);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-25vh) rotate(2deg); }
            50% { transform: translateY(-50vh) rotate(-2deg); }
            75% { transform: translateY(-75vh) rotate(1deg); }
            100% { transform: translateY(-120vh) rotate(0deg); }
        }

        @keyframes shake-emoji {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-1.5vmin) rotate(-10deg); }
            40% { transform: translateX(1.5vmin) rotate(10deg); }
            60% { transform: translateX(-1.5vmin) rotate(-10deg); }
            80% { transform: translateX(1.5vmin) rotate(10deg); }
        }

        .shake-error .balloon-content {
            animation: shake-emoji 0.4s ease-in-out;
            filter: brightness(0.7) sepia(1) hue-rotate(-50deg) saturate(5);
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .popped {
            animation: pop 0.3s ease-out forwards !important;
            pointer-events: none;
        }

        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 5vmin;
        }

        #end-screen h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 10vmin;
            color: #FF9F43;
            margin-bottom: 2vh;
            text-shadow: 2px 2px 0 #FFF;
        }

        #end-screen p {
            font-size: 4vmin;
            color: #2D3436;
            margin-bottom: 4vh;
        }

        #mistakes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vmin;
            margin-bottom: 4vh;
            max-width: 80vw;
        }

        .mistake-item {
            background: #FFF;
            border: 3px solid #FF6B6B;
            border-radius: 15px;
            padding: 2vmin;
            font-size: 6vmin;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.15s ease;
            width: 15vmin;
            height: 15vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .mistake-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mistake-item:active {
            transform: scale(0.9);
        }

        .restart-btn {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 3vmin 8vmin;
            font-size: 5vmin;
            font-family: 'Fredoka One', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2A9D8F, 0 10px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2A9D8F, 0 4px 4px rgba(0,0,0,0.2);
        }

        .confetti {
            position: absolute;
            width: 2vmin;
            height: 2vmin;
            background: #f00;
            animation: fall linear forwards;
            z-index: 300;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="main-menu">
        <h1 class="main-title">Welcome to<br>UEC Academy 🎓</h1>
        <button class="menu-btn" onclick="showReview()">Review Vocabulary 📚</button>
        <button class="menu-btn play-btn" onclick="showGame()">Let's Play 🤩</button>
    </div>

    <!-- PANTALLA DE REPASO -->
    <div id="review-screen">
        <button class="home-btn" onclick="showMainMenu()">🏠🔙</button>
        <h2 class="review-title">Tap a card to listen! 👂</h2>
        <div id="review-cards-container"></div>
    </div>

    <!-- CONTENEDOR DEL JUEGO -->
    <div id="game-container">
        <button class="home-btn" onclick="showMainMenu()">🏠🔙</button>
        <div id="game-ui">
            <button id="speaker-btn" onclick="playCurrentWord()">🔊</button>
            <div id="target-word"></div>
        </div>
        <div id="game-area"></div>
        <div id="end-screen">
            <h1>¡Great Job! 🎉</h1>
            <p>¡Lo hiciste muy bien!</p>
            <div id="mistakes-title" style="display:none; font-size: 4vmin; color: #FF6B6B; font-weight: bold; margin-bottom: 2vh;">
                Practiquemos estas un poco más (¡Tócalas para escuchar!):
            </div>
            <div id="mistakes-container"></div>
            <button class="restart-btn" onclick="initGame()">Jugar Otra Vez 🔄</button>
        </div>
    </div>

    <script>
        /* =========================================
           1. CONFIGURACIÓN Y VOCABULARIO
           ========================================= */
        const vocabulary = [
            // Pares de Opuestos con Emojis Específicos
            { word: "Open", emoji: "🤚", pair: "Shut" },
            { word: "Shut", emoji: "✊", pair: "Open" },
            
            { word: "Big", emoji: "🐘", pair: "Small" },
            { word: "Small", emoji: "🐜", pair: "Big" },
            
            { word: "Fast", emoji: "🚀", pair: "Slow" },
            { word: "Slow", emoji: "🐌", pair: "Fast" },
            
            { word: "Loud", emoji: "📢", pair: "Quiet" },
            { word: "Quiet", emoji: "🤫", pair: "Loud" },
            
            { word: "Tall", emoji: "🌲", pair: "Short" },
            { word: "Short", emoji: "🌱", pair: "Tall" },
            
            { word: "Thin", emoji: "🦩", pair: "Chubby" },
            { word: "Chubby", emoji: "🦛", pair: "Thin" },
            
            // Solo estos dos usan IMÁGENES
            { word: "Old", emoji: "img/old.jpg", pair: "New" },
            { word: "New", emoji: "img/new.jpg", pair: "Old" },
            
            { word: "Strong", emoji: "💪", pair: "Weak" },
            { word: "Weak", emoji: "🥀", pair: "Strong" },
            
            { word: "Nice", emoji: "😇", pair: "Bad" },
            { word: "Bad", emoji: "😈", pair: "Nice" }
        ];

        const balloonColors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE', '#FD79A8', '#55E6C1'];

        let gameQueue = [];
        let currentIndex = 0;
        let mistakes = [];
        let isLevelActive = false;
        let speechSynth = window.speechSynthesis;

        /* =========================================
           2. NAVEGACIÓN ENTRE PANTALLAS
           ========================================= */
        function showMainMenu() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('review-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'none';
            
            isLevelActive = false;
            speechSynth.cancel();
            document.getElementById('game-area').innerHTML = '';
        }

        function showReview() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('review-screen').style.display = 'flex';
            document.getElementById('game-container').style.display = 'none';
            createReviewCards();
        }

        function showGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('review-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            initGame();
        }

        /* =========================================
           3. LÓGICA DE REPASO (FLASHCARDS EN PARES)
           ========================================= */
        function createReviewCards() {
            const container = document.getElementById('review-cards-container');
            container.innerHTML = '';
            
            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Verificar si es imagen o emoji
                const isImage = item.emoji.includes('.jpg') || item.emoji.includes('.png');
                const contentHtml = isImage 
                    ? `<img src="${item.emoji}" class="card-img" alt="${item.word}">` 
                    : item.emoji;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">${contentHtml}</div>
                        <div class="card-back">${item.word}</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    if (!card.classList.contains('flipped')) {
                        card.classList.add('flipped');
                        speak(item.word);
                        
                        setTimeout(() => {
                            card.classList.remove('flipped');
                        }, 1200);
                    }
                });
                
                container.appendChild(card);
            });
        }

        /* =========================================
           4. FUNCIONES DE AUDIO
           ========================================= */
        function speak(text) {
            if (speechSynth.speaking) speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynth.speak(utterance);
        }

        function playSuccessSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        /* =========================================
           5. LÓGICA DEL JUEGO (MODIFICADA PARA 2 OPCIONES)
           ========================================= */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            // Usamos solo las palabras "principales" de cada par para la cola del juego
            // Tomamos los índices pares (0, 2, 4...) ya que definí el array manualmente en pares.
            const primaryWords = vocabulary.filter((_, i) => i % 2 === 0);

            gameQueue = shuffleArray([...primaryWords]);
            currentIndex = 0;
            mistakes = [];
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-area').innerHTML = '';
            loadLevel();
        }

        function loadLevel() {
            isLevelActive = true;
            const currentData = gameQueue[currentIndex];
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            // AQUÍ ESTÁ EL CAMBIO CLAVE: Solo 2 opciones
            // 1. La correcta (currentData)
            // 2. Su opuesto directo (buscamos en el array vocabulary quien tenga el word igual al pair de currentData)
            const oppositeData = vocabulary.find(v => v.word === currentData.pair);
            
            let options = [currentData, oppositeData];
            options = shuffleArray(options);

            options.forEach((opt, index) => {
                createBalloon(opt, opt.word === currentData.word, index);
            });

            document.getElementById('target-word').classList.remove('visible');
        }

        function createBalloon(data, isCorrect, index) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            balloon.style.backgroundColor = color;
            balloon.style.borderTopColor = color;

            // Posicionar los dos globos separados (izquierda y derecha)
            const leftPos = index === 0 ? 20 : 60; 
            balloon.style.left = leftPos + '%';

            const duration = 6 + Math.random() * 4;
            const delay = Math.random() * 2;
            balloon.style.animation = `floatUp ${duration}s linear ${delay}s infinite`;

            const content = document.createElement('div');
            content.className = 'balloon-content';
            
            // Verificar si es imagen o emoji
            const isImage = data.emoji.includes('.jpg') || data.emoji.includes('.png');
            if (isImage) {
                content.innerHTML = `<img src="${data.emoji}" class="balloon-img" alt="">`;
            } else {
                content.textContent = data.emoji;
            }
            
            balloon.appendChild(content);

            balloon.addEventListener('click', (e) => {
                e.stopPropagation();
                handleBalloonClick(balloon, isCorrect, data);
            });

            document.getElementById('game-area').appendChild(balloon);
        }

        function playCurrentWord() {
            if (currentIndex >= gameQueue.length) return;
            const currentData = gameQueue[currentIndex];
            
            speak(currentData.word);
            
            const wordEl = document.getElementById('target-word');
            wordEl.textContent = currentData.word;
            wordEl.classList.add('visible');
            
            setTimeout(() => {
                wordEl.classList.remove('visible');
            }, 1000);
        }

        function handleBalloonClick(balloon, isCorrect, data) {
            if (!isLevelActive) return;

            if (isCorrect) {
                isLevelActive = false;
                playSuccessSound();
                balloon.classList.add('popped');
                createConfetti(balloon.getBoundingClientRect());
                
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < gameQueue.length) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 800);
            } else {
                playErrorSound();
                balloon.classList.add('shake-error');
                
                if (!mistakes.find(m => m.word === data.word)) {
                    mistakes.push(data);
                }

                setTimeout(() => {
                    balloon.classList.remove('shake-error');
                }, 400);
            }
        }

        function endGame() {
            const endScreen = document.getElementById('end-screen');
            const mistakesContainer = document.getElementById('mistakes-container');
            const mistakesTitle = document.getElementById('mistakes-title');
            
            mistakesContainer.innerHTML = '';
            
            if (mistakes.length > 0) {
                mistakesTitle.style.display = 'block';
                mistakes.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'mistake-item';
                    
                    const isImage = m.emoji.includes('.jpg') || m.emoji.includes('.png');
                    if (isImage) {
                        div.innerHTML = `<img src="${m.emoji}" class="mistake-img" alt="">`;
                    } else {
                        div.textContent = m.emoji;
                    }
                    
                    div.title = "Toca para escuchar: " + m.word;
                    
                    div.addEventListener('click', () => {
                        speak(m.word);
                        div.style.transform = "scale(1.2)";
                        setTimeout(() => {
                            div.style.transform = "scale(1)";
                        }, 200);
                    });
                    
                    mistakesContainer.appendChild(div);
                });
                speak("Great job! Let's review these ones.");
            } else {
                mistakesTitle.style.display = 'none';
                speak("Excellent! Perfect score!");
            }
            
            endScreen.style.display = 'flex';
            launchFullConfetti();
        }

        function createConfetti(rect) {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 20; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = (rect.left + rect.width / 2) + 'px';
                conf.style.top = (rect.top + rect.height / 2) + 'px';
                
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200;
                conf.style.transform = `translate(${tx}px, ${ty}px)`;
                conf.style.transition = 'all 0.5s ease-out';
                
                document.body.appendChild(conf);
                
                setTimeout(() => {
                    conf.style.opacity = '0';
                    setTimeout(() => conf.remove(), 500);
                }, 50);
            }
        }

        function launchFullConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.top = '-5vh';
                    conf.style.animationDuration = (2 + Math.random() * 3) + 's';
                    document.body.appendChild(conf);
                    setTimeout(() => conf.remove(), 5000);
                }, i * 50);
            }
        }

        // Iniciar en el menú principal
        window.onload = showMainMenu;
    </script>
</body>
</html>
